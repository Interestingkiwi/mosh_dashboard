<div id="manifest-modal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h2 style="color: #ff9900; margin: 0;">INVENTORY</h2>
            <button class="close-btn" onclick="closeManifest()">&times;</button>
        </div>
        <div id="manifest-tabs" class="tab-container"></div>
        <div style="max-height: 50vh; overflow-y: auto;">
            <table class="manifest-table">
                <thead><tr><th style="text-align: left;">ITEM</th><th>QTY</th></tr></thead>
                <tbody id="manifest-body"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="mess-modal" class="modal-overlay">
    <div class="modal-content" style="border-color: #00ff00; box-shadow: 0 0 20px rgba(0,255,0,0.2); position: relative;">
        <div class="modal-header" style="border-bottom-color: #00ff00;">
            <h2 style="color: #00ff00; margin: 0;">SYNTHESIZER</h2>
            <button class="close-btn" onclick="closeMess()" style="color:#00ff00;">&times;</button>
        </div>

        <h3 style="color: #888; font-size: 0.9em; margin-top: 0;">AVAILABLE INGREDIENTS</h3>
        <ul id="kitchen-stock" style="list-style: none; padding: 0; color: #aaa; font-size: 0.8em; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px;"></ul>

        <h3 style="color: #888; font-size: 0.9em;">RECIPES</h3>
        <div id="recipe-list" style="max-height: 50vh; overflow-y: auto;"></div>

        <div id="mess-resolution" style="display: none; position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(10, 20, 10, 0.98); flex-direction: column; align-items: center; justify-content: center; z-index: 10;">
            <h2 style="color: #fff;">COOKING...</h2>

            <div style="background: #003300; border: 2px solid #00ff00; padding: 20px; text-align: center; border-radius: 10px; margin-bottom: 20px;">
                <p style="color: #888; margin: 0;">TARGET SCORE</p>
                <h1 id="cook-score" style="font-size: 4em; margin: 10px 0; color: #00ff00;">00</h1>
                <p id="cook-details" style="color: #aaa; font-size: 0.8em;">Base: 50 + Skill: 10</p>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 80%;">
                <button onclick="finalizeCook('Critical Success')" style="background: #00ff00; color: #000; border:none; padding: 15px; font-weight: bold; grid-column: span 2;">CRITICAL SUCCESS</button>
                <button onclick="finalizeCook('Success')" style="background: #00cc00; color: #fff; border:none; padding: 15px; font-weight: bold; grid-column: span 2;">SUCCESS</button>
                <button onclick="finalizeCook('Failure')" style="background: #cc6600; color: #fff; border:none; padding: 15px; font-weight: bold;">FAILURE</button>
                <button onclick="finalizeCook('Critical Failure')" style="background: #cc0000; color: #fff; border:none; padding: 15px; font-weight: bold;">CRITICAL FAIL</button>
                <button onclick="cancelCook()" style="background: #333; color: #fff; border: 1px solid #666; padding: 15px; grid-column: span 2;">CANCEL</button>
            </div>
        </div>
    </div>
</div>

<script>
    // --- SHARED CONSTANTS ---
    const CATEGORIES = ["Weapons", "Armor", "Equipment", "Food", "Medicine", "Ingredients", "Scrap Parts", "Misc"];
    let currentCategory = "Weapons";
    let activeRecipe = null; // Tracks which recipe is being cooked

    // --- MANIFEST FUNCTIONS ---
    function openManifest() { renderTabs(); renderManifest(); document.getElementById('manifest-modal').style.display = 'flex'; }
    function closeManifest() { document.getElementById('manifest-modal').style.display = 'none'; }

    function renderTabs() {
        const bar = document.getElementById('manifest-tabs');
        bar.innerHTML = '';
        CATEGORIES.forEach(cat => {
            const btn = document.createElement('button');
            btn.className = `tab-btn ${cat === currentCategory ? 'active' : ''}`;
            btn.innerText = cat;
            btn.onclick = () => { currentCategory = cat; renderTabs(); renderManifest(); };
            bar.appendChild(btn);
        });
    }

    function renderManifest() {
        const body = document.getElementById('manifest-body');
        body.innerHTML = '';
        if (!window.inventory) return;
        const items = window.inventory.filter(i => i.category === currentCategory);
        if (items.length === 0) { body.innerHTML = '<tr><td colspan="2" style="text-align:center; color:#555; padding:20px;">NO ITEMS FOUND</td></tr>'; return; }
        items.forEach(item => {
            body.innerHTML += `<tr><td><span style="color: #00f0ff; font-weight: bold;">${item.item}</span><span class="desc-col">${item.description}</span></td><td style="vertical-align: top;">x${item.qty}</td></tr>`;
        });
    }

    // --- MESS FUNCTIONS ---
    function openMess() { renderStock(); renderRecipes(); document.getElementById('mess-modal').style.display = 'flex'; }
    function closeMess() { document.getElementById('mess-modal').style.display = 'none'; document.getElementById('mess-resolution').style.display = 'none'; }

    function getTierTotal(tier) {
        if (!window.inventory) return 0;
        return window.inventory.filter(i => i.category === "Ingredients" && i.description.includes(`Tier ${tier}`)).reduce((sum, item) => sum + item.qty, 0);
    }

    function renderStock() {
        const list = document.getElementById('kitchen-stock');
        list.innerHTML = '';
        if (!window.inventory) return;

        // Group by Tier
        const ingredients = window.inventory.filter(i => i.category === "Ingredients");
        let tiers = {};
        ingredients.forEach(i => {
            const match = i.description.match(/Tier (\d+)/i);
            const tier = match ? match[1] : "Misc";
            if (!tiers[tier]) tiers[tier] = [];
            tiers[tier].push(i);
        });

        Object.keys(tiers).sort().forEach(t => {
            list.innerHTML += `<li style="margin-top:10px; margin-bottom:5px; color:#ff9900; font-weight:bold; border-bottom:1px solid #333;">TIER ${t}</li>`;
            tiers[t].forEach(i => list.innerHTML += `<li style="padding-left:10px; margin-bottom:3px;">${i.item} <span style="color:#666; font-size:0.8em;">(x${i.qty})</span></li>`);
        });
    }

    function renderRecipes() {
        const list = document.getElementById('recipe-list');
        list.innerHTML = '';
        if (!window.recipes) return;

        window.recipes.forEach(r => {
            let canCook = true;
            let reqHtml = '';
            r.requirements.forEach(req => {
                const avail = getTierTotal(req.tier);
                if (avail < req.qty) canCook = false;
                reqHtml += `<span style="color:${avail>=req.qty ? '#00ff00':'#ff3333'}; margin-right:10px; font-size:0.8em;">T${req.tier}: ${avail}/${req.qty}</span>`;
            });

            const card = document.createElement('div');
            card.style.border = "1px solid #333"; card.style.padding = "10px"; card.style.marginBottom = "10px";
            card.style.background = canCook ? "rgba(0,50,0,0.3)" : "transparent";

            card.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <strong style="color:#00ff00;">${r.name}</strong>
                    <button onclick="startCooking('${r.name}')" ${canCook ? '' : 'disabled'}
                        style="background:${canCook?'#00ff00':'#333'}; color:${canCook?'#000':'#888'}; border:none; padding:5px 10px; cursor:pointer;">COOK</button>
                </div>
                <div style="margin:5px 0;">${reqHtml}</div>
                <small style="color:#888;">${r.effect}</small>
            `;
            list.appendChild(card);
        });
    }

    // --- COOKING RESOLUTION ---
    function startCooking(name) {
        activeRecipe = window.recipes.find(r => r.name === name);
        const skill = window.playerCookingSkill || 0;

        // Difficulty Formula: 100 - (Sum of Ingredient Tier Values)
        // e.g. Tier 1 = 10pts, Tier 2 = 20pts
        let difficultyPenalty = 0;
        activeRecipe.requirements.forEach(req => {
            difficultyPenalty += (req.tier * 10 * req.qty);
        });

        const baseScore = 100 - difficultyPenalty;
        const totalScore = baseScore + skill;

        // Update UI
        document.getElementById('cook-score').innerText = totalScore;
        document.getElementById('cook-details').innerText = `Base: ${baseScore} + Skill: ${skill}`;

        // Show Overlay
        document.getElementById('mess-resolution').style.display = 'flex';
    }

    function finalizeCook(outcome) {
        if (!activeRecipe) return;

        // Use the global variable set in player_menu.html, or default to "Unknown"
        const player = window.currentPlayer || "Crew";

        socket.emit('complete_cooking', {
            player_name: player,
            recipe: activeRecipe.name,
            outcome: outcome
        });

        cancelCook(); // Closes resolution overlay
        closeMess();  // Closes mess modal
    }

    function cancelCook() {
        document.getElementById('mess-resolution').style.display = 'none';
        activeRecipe = null;
    }

    window.onclick = function(event) {
        if (event.target == document.getElementById('manifest-modal')) closeManifest();
        if (event.target == document.getElementById('mess-modal')) closeMess();
    }
</script>
