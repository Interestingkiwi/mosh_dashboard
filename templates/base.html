<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mothership OS</title>
    <style>
        body { background-color: #0d1117; color: #00f0ff; font-family: 'Courier New', monospace; margin: 20px; }
        .hud-panel { border: 1px solid #00f0ff; padding: 15px; margin-bottom: 10px; border-radius: 5px; }
        h1 { color: #ffffff; text-transform: uppercase; letter-spacing: 2px; }
        button { background: #003333; color: #00f0ff; border: 1px solid #00f0ff; padding: 10px; cursor: pointer; }
        button:hover { background: #00f0ff; color: #000; }
        .alert-RED { color: red; border-color: red; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script type="text/javascript">
        var socket = io();

        // Universal listener: When server says "update_state", everyone updates their UI
        socket.on('update_state', function(state) {
            console.log("State Received:", state);
            updateInterface(state); // Defined in specific templates
        });
    </script>
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
