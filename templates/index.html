{% extends "base.html" %}
{% block content %}
<div style="text-align: center; padding-top: 20px;">
    <h1>IDENTITY VERIFICATION</h1>
    <p style="color: #888;">Select your personnel file:</p>

    <div style="display: flex; flex-direction: column; gap: 15px; max-width: 300px; margin: 0 auto;">

        {% for p in players %}
        <a href="/dashboard/{{ p.name }}">
            <button style="width: 100%; padding: 20px; font-size: 1.2em; text-align: left; display: flex; justify-content: space-between;">
                <span>{{ p.name }}</span>
                <span style="font-size: 0.8em; color: #00f0ff;">{{ p.class }}</span>
            </button>
        </a>
        {% endfor %}

        <br>
        <hr style="border-color: #333; width: 50%;">

        <a href="/gm">
            <button style="width: 100%; padding: 10px; background: #220000; color: #aa0000; border: 1px solid #550000; font-size: 0.9em;">
                // SYSTEM OVERRIDE (GM)
            </button>
        </a>
    </div>
</div>
{% endblock %}
