<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mothership: Main Display</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>
<body>

<div class="container">
    <div id="map-container" class="hud-panel">
        <canvas id="galaxy-canvas"></canvas>

        <div id="planet-info">
            <h2>SYSTEM NAME</h2>
            <p>System description goes here...</p>
        </div>
    </div>

    <div class="hud-panel" style="flex: 1; display: flex; flex-direction: column; gap: 20px;">
        <h1>JIC-IV Von Braun</h1>
        <hr>

        <div>
            <h3>Current System</h3>
            <h2 id="sys-name" style="color: #ff9900; font-size: 1.5em; margin: 0;">{{ state.current_system }}</h2>
            <h4 id="loc-name" style="color: #00f0ff; margin-top: 5px;">Orbiting: {{ state.current_location }}</h4>
        </div>

        <div>
            <div style="display:flex; justify-content:space-between;"><span>Hull Integrity</span> <span id="hull-val">{{ state.hull }}%</span></div>
            <div style="width: 100%; background: #333; height: 10px; margin-top:5px;">
                <div id="hull-bar" style="width: {{ state.hull }}%; background: #ff3333; height: 100%;"></div>
            </div>
        </div>

        <div>
            <div style="display:flex; justify-content:space-between;"><span>Shields</span> <span id="shield-val">{{ state.shields }}%</span></div>
            <div style="width: 100%; background: #333; height: 10px; margin-top:5px;">
                <div id="shield-bar" style="width: {{ state.shields }}%; background: #00f0ff; height: 100%;"></div>
            </div>
        </div>

        <div>
            <div style="display:flex; justify-content:space-between;"><span>Fuel Reserves</span> <span id="fuel-val">{{ state.fuel }}%</span></div>
            <div style="width: 100%; background: #333; height: 10px; margin-top:5px;">
                <div id="fuel-bar" style="width: {{ state.fuel }}%; background: #ffcc00; height: 100%;"></div>
            </div>
        </div>

        <hr style="border-color: #333; margin: 10px 0;">

        <div>
            <h3>Console</h3>
            <div class="console-grid">
                <button class="console-btn">Pilot</button>
                <button class="console-btn">Engineering</button>
                <button class="console-btn">Gunner</button>

                <button class="console-btn">Map</button>
                <button class="console-btn" onclick="openManifest()">Manifest</button>
                <button class="console-btn">Requisitions</button>

                <button class="console-btn">Medical</button>
                <button class="console-btn">Lab</button>
                <button class="console-btn">Mental</button>

                <button class="console-btn" onclick="openMess()">Mess</button>
                <button class="console-btn">Crew</button>
                <button class="console-btn">Logs</button>
            </div>
        </div>

    </div>
</div>

<script>
    // 1. Setup global data needed by the shared modals
    // The included modals.html file expects these variables to exist!
    window.unlockedSystems = {{ unlocks.systems | tojson }};
    window.unlockedLocations = {{ unlocks.locations | tojson }};
    window.inventory = {{ inventory | tojson }};
    window.recipes = {{ recipes | tojson }};

    // 2. Socket Listeners
    var socket = io();
    socket.on('update_state', function(state) {
        // Update Text
        document.getElementById('sys-name').innerText = state.current_system;
        document.getElementById('loc-name').innerText = "Orbiting: " + state.current_location;
        document.getElementById('hull-val').innerText = state.hull + "%";
        document.getElementById('shield-val').innerText = state.shields + "%";
        document.getElementById('fuel-val').innerText = state.fuel + "%";

        // Update Bars
        document.getElementById('hull-bar').style.width = state.hull + "%";
        document.getElementById('shield-bar').style.width = state.shields + "%";
        document.getElementById('fuel-bar').style.width = state.fuel + "%";

        // Dynamic Colors
        if(state.shields < 30) {
            document.getElementById('shield-bar').style.backgroundColor = "red";
        } else {
            document.getElementById('shield-bar').style.backgroundColor = "#00f0ff";
        }

        // Update Map
        if (typeof updateMapState === "function") {
            updateMapState(state.current_system, state.target_system);
        }

        // Update Inventory/Recipes if changed
        if (state.inventory) {
            window.inventory = state.inventory;
            // If the manifest modal is currently open, refresh it to show new items
            if (document.getElementById('manifest-modal') && document.getElementById('manifest-modal').style.display === 'flex') {
                // These functions are defined in 'includes/modals.html'
                if (typeof renderManifest === 'function') renderManifest();
            }
        }
    });
</script>

{% include 'includes/modals.html' %}

<script src="{{ url_for('static', filename='js/galaxy_map.js') }}?v=4"></script>

</body>
</html>
